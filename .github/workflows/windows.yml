            if (Test-Path $link) { Write-Host "$link already exists" }
            else { New-Item -ItemType Junction -Path $link -Target $atlRoot | Out-Null; Write-Host "Linked $link -> $atlRoot" }
          }

      # actions/cache saves only on success; split restore/save to bank library progress on failure.
      - name: ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-x64-third-party-

