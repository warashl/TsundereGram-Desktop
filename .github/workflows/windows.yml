        if: always() && env.LIBS_CHANGED == '1'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.job }}

      - name: Save libraries cache.
        if: always() && env.LIBS_CHANGED == '1'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.job }}

      - name: Save Qt cache.
        if: always() && env.LIBS_CHANGED == '1'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-qt-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.job }}

      - name: Build tree cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.os }}-x64-out-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-x64-out-${{ env.CACHE_KEY }}-

      - name: Apply TsundereGram branding.
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pillow
          python tsg/scripts/apply.py "$TBUILD/$REPO_NAME" --part freeze
          python tsg/scripts/apply.py "$TBUILD/$REPO_NAME" --part branding
          echo "TSG_SHA=$(git -C tsg rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Apply TsundereGram features.
        id: features
        continue-on-error: true
        shell: bash
        run: python tsg/scripts/apply.py "$TBUILD/$REPO_NAME" --part features

      - name: Undo partially applied features.
        if: steps.features.outcome == 'failure'
        shell: bash
        run: python tsg/scripts/apply.py "$TBUILD/$REPO_NAME" --part revert-features

      - name: Configure.
        run: call tsg\scripts\configure.bat

      - name: Time budget.
        shell: bash
        run: |
          now=$(date +%s); start=$(cat "$RUNNER_TEMP/job_start.txt")
          left=$(( 345 - (now - start) / 60 - 30 ))
          [ $left -lt 20 ] && left=20
          echo "BUILD_MINUTES=$left" >> $GITHUB_ENV; echo "build budget: $left minutes"

      - name: Build TsundereGram Desktop.
        id: build1
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.BUILD_MINUTES) }}
        shell: pwsh
        env:
          _CL_: /MP2
        run: tsg\scripts\build.ps1 -Label build1

      - name: Report the failed build.
        if: steps.build1.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tsg/scripts/report.sh build1

      - name: Revert features after a failed build.
        id: revert
        if: steps.build1.outcome != 'success' && steps.features.outcome == 'success'
        shell: bash
        run: |
          python tsg/scripts/apply.py "$TBUILD/$REPO_NAME" --part revert-features
          now=$(date +%s); start=$(cat "$RUNNER_TEMP/job_start.txt")
          left=$(( 345 - (now - start) / 60 - 25 ))
          [ $left -lt 10 ] && left=10
          echo "BUILD_MINUTES=$left" >> $GITHUB_ENV; echo "fallback budget: $left minutes"

      - name: Build without the new features.
        id: build2
        if: steps.revert.outcome == 'success'
        timeout-minutes: ${{ fromJSON(env.BUILD_MINUTES) }}
        shell: pwsh
        env:
          _CL_: /MP2
        run: tsg\scripts\build.ps1 -Label build2

      - name: Report the fallback build.
        if: failure() && steps.build2.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tsg/scripts/report.sh build2

      - name: Write the manifest.
        if: steps.build1.outcome == 'success' || steps.build2.outcome == 'success'
        shell: bash
        run: |
          python tsg/scripts/apply.py "$TBUILD/$REPO_NAME" --part manifest
          if [ "${{ steps.build1.outcome }}" = "success" ] && [ "${{ steps.features.outcome }}" = "success" ]; then
            echo "FEATURES=1" >> $GITHUB_ENV
          else
            echo "FEATURES=0" >> $GITHUB_ENV
          fi

      - name: Save build tree cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
            !${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Release\*.exe
          key: ${{ runner.os }}-x64-out-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package.
        shell: pwsh
        run: |
          $release = "$env:TBUILD\$env:REPO_NAME\out\Release"
          $exe = Join-Path $release 'TsundereGram.exe'
          if (-not (Test-Path $exe)) { Write-Error "TsundereGram.exe is missing"; exit 1 }
          $deploy = Join-Path $env:GITHUB_WORKSPACE 'deploy'
          $dir = Join-Path $deploy 'TsundereGram'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item $exe $dir
          $d3d = Join-Path $release 'modules\x64\d3d\d3dcompiler_47.dll'
          if (Test-Path $d3d) {
            $m = Join-Path $dir 'modules\x64\d3d'
            New-Item -ItemType Directory -Path $m -Force | Out-Null
            Copy-Item $d3d $m
          }
          Set-Location $deploy
          & 7z a -mx9 TsundereGram-Desktop-x64.zip TsundereGram\
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$env:TBUILD\$env:REPO_NAME\Telegram\Resources\art\icon256.ico" "$env:GITHUB_WORKSPACE\tsg\installer\icon.ico"
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($iscc) {
            & $iscc.FullName "/DMyAppVersion=$env:AppVersionStr" "/DSourceDir=$dir" "/DOutputDir=$deploy" "$env:GITHUB_WORKSPACE\tsg\installer\tsunderegram.iss"
            if ($LASTEXITCODE -ne 0) { Write-Host 'installer failed' }
          }
          Get-ChildItem $deploy | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        name: Upload the artifacts.
        with:
          name: TsundereGram-Desktop-x64-${{ github.run_number }}
          path: |
            deploy\*.zip
            deploy\*.exe

      - name: Publish the release.
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="desktop-v${AppVersionStr}-${GITHUB_RUN_NUMBER}"
          if [ "$FEATURES" = "1" ]; then F="все функции TsundereGram включены"; else F="базовая сборка (функции TsundereGram в следующей сборке)"; fi
          cat > notes.md <<NOTES
          TsundereGram Desktop ${AppVersionStr} для Windows x64 (на базе AyuGram Desktop / Telegram Desktop).

          - **TsundereGram-Desktop-Setup-x64.exe** — установщик
          - **TsundereGram-Desktop-x64.zip** — портативная версия (распакуй и запусти TsundereGram.exe)

          Сборка: ${F}. Коммит: ${TSG_SHA}.
          NOTES
          FILES=(deploy/TsundereGram-Desktop-x64.zip)
          [ -f deploy/TsundereGram-Desktop-Setup-x64.exe ] && FILES+=(deploy/TsundereGram-Desktop-Setup-x64.exe)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "${GITHUB_REF_NAME}" \
            --title "TsundereGram Desktop ${AppVersionStr} (сборка ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md --latest "${FILES[@]}"
