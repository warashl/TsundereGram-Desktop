name: Secrets check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/secrets-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The config secrets are available
        env:
          TSG_SALT: ${{ secrets.TSG_SALT }}
          TSG_AES_KEY: ${{ secrets.TSG_AES_KEY }}
        run: |
          echo "salt length ${#TSG_SALT}, key length ${#TSG_AES_KEY}"
          [ ${#TSG_SALT} -gt 0 ] && [ ${#TSG_AES_KEY} -gt 0 ]
